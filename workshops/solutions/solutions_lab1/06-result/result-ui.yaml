apiVersion: v1
kind: Service
metadata:
  name: result-ui
  namespace: voting
spec:
  selector:
    app: result-ui
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 80


---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: result-ui
  namespace: voting
spec:
  replicas: 2
  selector:
    matchLabels:
      app: result-ui
  template:
    metadata:
      labels:
        app: result-ui
    spec:
      containers:
        - name: result-ui
          image: mohamed1780/result-ui:latest
          ports:
            - containerPort: 80