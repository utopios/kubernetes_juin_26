apiVersion: v1
kind: Service
metadata:
  name: vote
  namespace: voting
spec:
  selector:
    app: vote
  ports:
    - port: 5000
      targetPort: 5000
  
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote
  namespace: voting
  annotations:
    kubernetes.io/change-cause: "déploiement initial"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: vote
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
        - name: vote
          image: mohamed1780/vote:latest
          ports:
            - containerPort: 5000
          env:
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi