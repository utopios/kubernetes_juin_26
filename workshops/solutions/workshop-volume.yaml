---
# -----------------------------------------------------------------------------
# Étape 2 : Volume EmptyDir (stockage temporaire, partagé entre conteneurs)
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Pod
metadata:
  name: nginx-emptydir
  labels:
    workshop: volume
spec:
  containers:
    - name: nginx
      image: nginx:latest
      ports:
        - containerPort: 80
      volumeMounts:
        - name: cache-volume
          mountPath: /tmp/cache
        - name: logs-volume
          mountPath: /var/log/nginx
    - name: log-reader
      image: busybox
      command: ["/bin/sh"]
      args:
        - "-c"
        - "while true; do echo 'Reading logs...'; tail -f /var/log/nginx/access.log 2>/dev/null || sleep 5; done"
      volumeMounts:
        - name: logs-volume
          mountPath: /var/log/nginx
  volumes:
    - name: cache-volume
      emptyDir: {}
    - name: logs-volume
      emptyDir: {}

---
# -----------------------------------------------------------------------------
# Étape 3 : PersistentVolumeClaim + Deployment + Service pour MySQL
# -----------------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  labels:
    workshop: volume
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard          

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-persistent
  labels:
    workshop: volume
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-persistent
  template:
    metadata:
      labels:
        app: mysql-persistent
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "rootpassword"
            - name: MYSQL_DATABASE
              value: "testdb"
            - name: MYSQL_USER
              value: "testuser"
            - name: MYSQL_PASSWORD
              value: "testpass"
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: mysql-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  labels:
    workshop: volume
spec:
  selector:
    app: mysql-persistent
  ports:
    - port: 3306
      targetPort: 3306
  type: ClusterIP

---
# -----------------------------------------------------------------------------
# Étape 4 : WordPress avec volume persistant (utilise mysql-service)
# -----------------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wordpress-pvc
  labels:
    workshop: volume
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress-persistent
  labels:
    workshop: volume
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wordpress-persistent
  template:
    metadata:
      labels:
        app: wordpress-persistent
    spec:
      containers:
        - name: wordpress
          image: wordpress:latest
          ports:
            - containerPort: 80
          env:
            - name: WORDPRESS_DB_HOST
              value: mysql-service:3306
            - name: WORDPRESS_DB_NAME
              value: testdb
            - name: WORDPRESS_DB_USER
              value: testuser
            - name: WORDPRESS_DB_PASSWORD
              value: testpass
          volumeMounts:
            - name: wordpress-storage
              mountPath: /var/www/html
      volumes:
        - name: wordpress-storage
          persistentVolumeClaim:
            claimName: wordpress-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: wordpress-service
  labels:
    workshop: volume
spec:
  selector:
    app: wordpress-persistent
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080            
  type: NodePort                 

---
# -----------------------------------------------------------------------------
# Étape 5 : Volume ConfigMap (configuration nginx + page html)
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  labels:
    workshop: volume
data:
  nginx.conf: |
    server {
        listen 80;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location /api {
            return 200 "API endpoint working!\n";
            add_header Content-Type text/plain;
        }
    }
  index.html: |
    <!DOCTYPE html>
    <html>
    <head><title>Configuration depuis ConfigMap</title></head>
    <body>
        <h1>Nginx configuré avec ConfigMap</h1>
        <p>Cette page est servie par une configuration dans un ConfigMap</p>
        <a href="/api">Tester l'API</a>
    </body>
    </html>

---
apiVersion: v1
kind: Pod
metadata:
  name: nginx-configmap
  labels:
    workshop: volume
spec:
  containers:
    - name: nginx
      image: nginx:latest
      ports:
        - containerPort: 80
      volumeMounts:
        - name: config-volume
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: nginx.conf
        - name: html-volume
          mountPath: /usr/share/nginx/html/index.html
          subPath: index.html
  volumes:
    - name: config-volume
      configMap:
        name: nginx-config
    - name: html-volume
      configMap:
        name: nginx-config

---
# -----------------------------------------------------------------------------
# Étape 6 : Volume Secret (données sensibles)
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  labels:
    workshop: volume
type: Opaque
# stringData : Kubernetes encode automatiquement en base64 (plus lisible en formation)
stringData:
  username: admin
  password: password123
  config.properties: |
    db_url=jdbc:mysql://mysql-service:3306/testdb
    db_user=admin
    db_password=password123

---
apiVersion: v1
kind: Pod
metadata:
  name: app-with-secret
  labels:
    workshop: volume
spec:
  containers:
    - name: app
      image: busybox
      command: ["/bin/sh"]
      args:
        - "-c"
        - "while true; do echo 'App running...'; cat /etc/secrets/config.properties; sleep 30; done"
      env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: password
      volumeMounts:
        - name: secret-volume
          mountPath: /etc/secrets
          readOnly: true
  volumes:
    - name: secret-volume
      secret:
        secretName: db-secret

---
# -----------------------------------------------------------------------------
# Étape 8 : Volume HostPath (développement uniquement — pas pour la production)
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Pod
metadata:
  name: nginx-hostpath
  labels:
    workshop: volume
spec:
  containers:
    - name: nginx
      image: nginx:latest
      ports:
        - containerPort: 80
      volumeMounts:
        - name: host-volume
          mountPath: /usr/share/nginx/html
  volumes:
    - name: host-volume
      hostPath:
        path: /tmp/nginx-data
        type: DirectoryOrCreate
