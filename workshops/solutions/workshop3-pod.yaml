apiVersion: v1
kind: Pod
metadata:
  name: production-pod
spec:
  nodeSelector:
    environment: production
    disktype: ssd
  containers:
  - name: app
    image: nginx:1.21
    resources:
      requests:
        cpu: 100m
        memory: 128Mi

---

apiVersion: v1
kind: Pod
metadata:
  name: impossible-pod
spec:
  nodeSelector:
    nonexistent: "true"
  containers:
  - name: app
    image: nginx:1.21

---

apiVersion: v1
kind: Pod
metadata:
  name: affinity-required
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: disktype
            operator: In
            values: ["ssd", "nvme"]
  containers:
  - name: app
    image: nginx:1.21